<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout</h1>
    <p>Hier sehen Sie Ihre Bestellung und geben Ihre Adresse ein.</p>
    <section>
        <h2>Bestellübersicht</h2>
        <div id="order-summary">
            <!-- Dynamisch generierte Bestellübersicht -->
        </div>
    </section>
    <section>
        <h2>Lieferadresse</h2>
        <form>
            <label for="first-name">Vorname:</label><input type="text" id="first-name" name="first-name" required><br>
            <label for="last-name">Nachname:</label><input type="text" id="last-name" name="last-name" required><br>
            <label for="street">Straße:</label><input type="text" id="street" name="street" required><br>
            <label for="house-number">Hausnummer:</label><input type="text" id="house-number" name="house-number" required><br>
            <label for="address-line2">Adresszusatz:</label><input type="text" id="address-line2" name="address-line2"><br>
            <label for="city">Stadt:</label><input type="text" id="city" name="city" required><br>
            <label for="zip">Postleitzahl:</label><input type="text" id="zip" name="zip" required><br>
            <label for="country">Land:</label><input type="text" id="country" name="country" required><br>
            
            <p>Versandoptionen:</p>

            <input type="radio" id="shipping-standard" name="shippingOption" value="standard" required>
            <label for="shipping-standard">Standardversand (3-5 Tage) - 5.00€</label><br>

            <input type="radio" id="shipping-express" name="shippingOption" value="express">
            <label for="shipping-express">Expressversand (1-2 Tage) - 15.00€</label><br>

            <input type="radio" id="shipping-premium" name="shippingOption" value="premium">
            <label for="shipping-premium">Ich bin reich und hübsch (3-5 Tage) - 70.00€</label><br><br>

            <p>Zahlungsmethoden:</p>
            <input type="radio" id="payment-paypal" name="paymentMethod" value="paypal" required>
            <label for="payment-paypal">PayPal</label><br>
            <input type="radio" id="payment-prepaid-banktransfer" name="paymentMethod" value="payment-prepaid-banktransfer">
            <label for="payment-banktransfer">Vorauskasse</label><br><br>

            <button type="submit">kostenpflichtig bestellen</button>
        </form>
    </section>
</body>
</html>
