<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>iShop – Produkte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS (Frontend-Framework) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Deine eigenen Styles -->
  <link rel="stylesheet" href="../style/base.css">
  <link rel="stylesheet" href="../style/products.css">

</head>

<body class="bento-page">
  <!-- Bootstrap-Container hinzugefügt -->
  <div class="ishop-shell container-lg py-4">

    <!-- Header -->
    <header class="ishop-header glass-card d-flex justify-content-between align-items-center mb-4">
      <div class="header-left d-flex align-items-center gap-3">
        <div class="logo">ISHOP</div>
        <nav class="main-nav d-flex gap-2">
          <button class="nav-btn is-active btn btn-outline-light btn-sm" type="button">Home</button>
          <button class="nav-btn btn btn-outline-light btn-sm" type="button">Produkte</button>
          <button class="nav-btn btn btn-outline-light btn-sm" type="button">Kontakt</button>
        </nav>
      </div>

      <div class="header-right d-flex align-items-center gap-3">
        <div class="cart-summary small text-end">
          <span class="cart-label fw-semibold">Warenkorb:</span>
          <span id="cart-count">0</span> Artikel ·
          <span id="cart-total">0.00</span> €
        </div>
        <a class="cart-btn btn btn-primary btn-sm" href="checkout.html">Zum Warenkorb</a>
      </div>
    </header>

    <main class="ishop-main">

      <!-- Produkt-Strip (nur Bild + Titel, horizontal scrollbar) -->
      <section class="product-strip glass-card mb-4">
        <div id="product-list" class="product-strip-inner">
          <!-- Produkte werden per JS eingefügt -->
        </div>
      </section>

      <!-- Bento-Grid: Main Product + Details + Beschreibung -->
      <section class="bento-grid">

        <!-- Main Product links -->
        <article class="bento-main glass-card">
          <div class="main-product-image" id="main-product-image"></div>
          <div class="main-product-overlay">
            <h2 id="main-product-title">Produkt auswählen</h2>
            <p class="main-product-subtitle">
              Klicke oben auf ein Produkt, um Details zu sehen.
            </p>
          </div>
        </article>

        <!-- Detail-Panel rechts -->
        <aside class="bento-details glass-card">
          <h3 class="details-title" id="detail-title">Keine Auswahl</h3>

          <div class="details-row">
            <div class="details-label">Preis</div>
            <div class="details-value" id="detail-price">–</div>
          </div>
          <div class="details-row">
            <div class="details-label">Produkt-ID</div>
            <div class="details-value" id="detail-id">–</div>
          </div>
          <div class="details-row">
            <div class="details-label">Verfügbar</div>
            <div class="details-value" id="detail-stock">–</div>
          </div>

          <div class="quantity-control d-flex align-items-center gap-2 my-3">
            <button class="qty-btn btn btn-outline-secondary btn-sm" type="button" id="qty-minus">−</button>
            <input type="number" id="qty-input" min="1" value="1" class="form-control form-control-sm" style="max-width: 80px;">
            <button class="qty-btn btn btn-outline-secondary btn-sm" type="button" id="qty-plus">+</button>
          </div>

          <button class="primary-btn btn btn-success w-100 mt-2" type="button" id="add-to-cart-btn">
            In den Warenkorb
          </button>
        </aside>

        <!-- Beschreibung unten -->
        <section class="bento-description glass-card">
          <h3>Beschreibung</h3>
          <p id="detail-description">
            Wähle oben ein Produkt aus, um die Beschreibung zu sehen.
          </p>
        </section>

      </section>
    </main>

    <footer class="ishop-footer mt-4 text-center text-muted small">
      <p class="mb-0">© 2025 iShop</p>
    </footer>
  </div>

  <!-- Deine App-Logik -->
  <script src="../app.js"></script>

  <!-- Bootstrap 5 JS Bundle (für Komponenten wie Modals etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
