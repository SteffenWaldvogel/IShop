<!doctype html>
<html lang="en">

<head>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
    }
    header {
        background-color: #ffffff;
        padding: 10px;
        border: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
    }
    main {
        margin: 20px auto;
        padding: 20px;
        max-width: 800px;
    }
    article {
        background-color: #ffffff;
        padding: 15px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
    }
    </style>
  <meta charset="utf-8">
  <title>ishop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header>
    <h1>ishop</h1>
    <div>
        Cart: <span id="cart-count">0</span> items
        Total: <span id="cart-total">0.00</span>€
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    
    <section>
      <h2>Welcome to ishop</h2>
      <p>Your one-stop shop for all your needs!</p>
    </section>
    <section>
        <h2>Your Cart</h2>
        <ul id="cart-items">
            <!-- Cart items will be dynamically added here -->
        </ul>
        <button id="clear-cart">Clear Cart</button>
    </section>
    <section>
      <h2>Featured Products</h2>
      <div id="product-list">
        <!-- Products will be dynamically added here -->
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 ishop</p>
  </footer>

  <script src = "app.js"></script>
</body>

</html>
